# Runs the whole system in containers. `docker compose up` starts the broker and the publisher
# web UI (http://localhost:3000). Terminal publishers and receivers are interactive, so start
# each one with `docker compose run` (see README.md, "Option A").
services:
  broker:
    build: ./Broker
    ports:
      - "5000:5000"
    networks:
      - pad-net

  publisher-ui:
    build: ./Publisher
    command: ["--ui", "broker", "5000", "3000"]
    depends_on:
      - broker
    ports:
      - "3000:3000"
    networks:
      - pad-net

  publisher:
    build: ./Publisher
    profiles: ["clients"]
    depends_on:
      - broker
    stdin_open: true
    tty: true
    networks:
      - pad-net

  receiver:
    build: ./Receiver
    profiles: ["clients"]
    depends_on:
      - broker
    tty: true
    networks:
      - pad-net

networks:
  pad-net:
    driver: bridge
